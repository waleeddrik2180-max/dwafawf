<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قصيدة ومعناها</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column. Calligraphic title, tab switch (write / library), option panel, verse card with two hemistichs split by a diamond. */
:root{
  --bg:#eef2f0;--card:#fbfcfb;--ink:#13272b;--muted:#5d7276;--line:#cfdad7;
  --accent:#0f5c63;--accent-ink:#ffffff;--gold:#a8741a;--chip:#e2eae8;--danger:#a3342b;
  --f-title:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  --f-verse:"Amiri","Traditional Arabic","Times New Roman",serif;
  --f-ui:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c191c;--card:#12252a;--ink:#e9f1ee;--muted:#9bb2b4;--line:#244045;
  --accent:#5fc2c0;--accent-ink:#06191b;--gold:#e3ad4a;--chip:#17313a;--danger:#ef8d82;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c191c;--card:#12252a;--ink:#e9f1ee;--muted:#9bb2b4;--line:#244045;
  --accent:#5fc2c0;--accent-ink:#06191b;--gold:#e3ad4a;--chip:#17313a;--danger:#ef8d82;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:680px;margin:0 auto}
header{text-align:center;padding-block:32px 8px}
.hello{font-family:var(--f-verse);font-weight:700;font-size:clamp(1.2rem,5vw,1.6rem);color:var(--gold);margin-bottom:2px}
h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.3;color:var(--accent);text-wrap:balance}
header p{margin:8px auto 0;max-width:30em;color:var(--muted);line-height:1.8;text-wrap:balance}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 0;color:var(--gold)}
.rule i{display:block;height:1px;width:64px;background:var(--line)}
.rule b{display:block;width:9px;height:9px;transform:rotate(45deg);background:var(--gold)}
.tabs{display:flex;gap:6px;margin-top:22px;padding:4px;background:var(--chip);border-radius:12px}
.tabs button{flex:1;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 0 var(--line)}
main{padding-block:6px 64px}
.label{margin:20px 0 8px;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-family:inherit;font-size:.98rem;cursor:pointer;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--ink)}
.chips button:hover{border-color:var(--accent)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.opts label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0}
select,input[type=text]{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem}
input::placeholder{color:var(--muted)}
.extra{margin-top:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.go{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-title);font-weight:700;font-size:1.3rem;cursor:pointer}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{margin-top:26px;padding:26px clamp(14px,4vw,32px) 22px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0;text-align:center;font-family:var(--f-title);font-weight:700;font-size:1.8rem;line-height:1.4;color:var(--accent);text-wrap:balance}
.card .tag{margin-top:6px;text-align:center;font-size:.85rem;color:var(--muted)}
.card .rule{margin:10px auto 16px}
.v{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3vw,22px);padding:11px 0;border-bottom:1px solid var(--line);font-family:var(--f-verse);font-size:clamp(1.15rem,4.6vw,1.5rem);line-height:2;animation:rise .5s ease both;animation-delay:calc(var(--i,0)*90ms)}
.v:last-of-type{border-bottom:0}
.v span{min-width:0;text-align:center;text-wrap:balance}
.v em{display:block;width:7px;height:7px;transform:rotate(45deg);background:var(--gold);opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--gold)}
.sec p{margin:0;line-height:2;font-size:1.05rem}
.w{display:flex;gap:10px;padding:5px 0;line-height:1.8}
.w b{flex:0 0 auto;color:var(--accent);font-family:var(--f-verse);font-size:1.15rem}
.w span{min-width:0;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.btn{font-family:inherit;font-size:.95rem;cursor:pointer;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.main:hover:not(:disabled){color:var(--accent-ink);filter:brightness(1.08)}
.btn.del{color:var(--danger)}
.btn.del:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.fallback{margin-top:12px;width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--f-verse);font-size:1.1rem;line-height:1.9}
.note{margin-top:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.msg{text-align:center;color:var(--muted);margin-top:32px;line-height:1.9}
.msg.busy{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.lib{display:grid;gap:12px;margin-top:20px}
.item{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.item h4{margin:0;font-family:var(--f-title);font-size:1.35rem;color:var(--accent)}
.item .meta{margin-top:2px;font-size:.8rem;color:var(--muted)}
.item .first{margin:10px 0 0;font-family:var(--f-verse);font-size:1.15rem;line-height:1.9}
.item .acts{justify-content:flex-start;margin-top:12px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.v,.msg.busy{animation:none}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
<header>
<div class="hello">يالله حيّه بندر الشيخ</div>
<h1>أمر، وش تبي قصيدة؟</h1>
<p>اختر اللي تبيه، وتجيك قصيدة جديدة كل مرة مع شرح معناها</p>
<div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
</header>
<div class="tabs" role="tablist">
<button id="tabWrite" class="on" role="tab">اكتب قصيدة</button>
<button id="tabLib" role="tab">مكتبتي</button>
</div>
<main>
<section id="viewWrite">
<div class="label">الموضوع</div>
<div class="chips" id="chips"></div>
<input class="extra" type="text" id="extra" placeholder="أو اكتب اللي تبيه (مثلاً: قصيدة عن الغربة)">
<div class="opts">
<label for="style">الأسلوب
<select id="style"><option>فصحى</option><option>شعبي (نبطي)</option></select></label>
<label for="meter">البحر
<select id="meter"><option value="">تلقائي</option><option>الطويل</option><option>الكامل</option><option>الوافر</option><option>البسيط</option><option>الرمل</option><option>الخفيف</option><option>المتقارب</option><option>الرجز</option><option>الهزج</option></select></label>
<label for="rhyme">حرف القافية
<select id="rhyme"><option value="">تلقائي</option></select></label>
<label for="len">عدد الأبيات
<select id="len"><option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option></select></label>
</div>
<label class="check"><input type="checkbox" id="verify" checked> دقّق الوزن بعد الكتابة (أبطأ شوي وأضبط)</label>
<button class="go" id="go">هات قصيدة</button>
<div id="out" aria-live="polite"></div>
</section>
<section id="viewLib" class="hidden">
<div id="libOut"></div>
</section>
</main>
</div>
<script>
var themes=["غزل","حكمة","فخر","شوق","رثاء","وطن","وصف الطبيعة","عتاب"],pick="غزل";
var $=function(i){return document.getElementById(i)};
var out=$("out"),go=$("go"),chips=$("chips"),libOut=$("libOut");
var cur=null,curId=null,lib=[],libReady=false,dbRef=null,busy=false;
"ابتثجحدرزسشصعفقكلمنهوي".split("").forEach(function(c){var o=document.createElement("option");o.textContent=c;$("rhyme").appendChild(o)});
themes.forEach(function(t){var b=document.createElement("button");b.textContent=t;if(t===pick)b.className="on";
b.onclick=function(){pick=t;chips.querySelectorAll("button").forEach(function(x){x.className=""});b.className="on"};chips.appendChild(b)});
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function rule(){var r=el("div","rule");r.setAttribute("aria-hidden","true");r.appendChild(el("i"));r.appendChild(el("b"));r.appendChild(el("i"));return r}
function btn(txt,cls,fn){var b=el("button","btn"+(cls?" "+cls:""),txt);b.onclick=fn;return b}
function msg(t,cls){out.innerHTML="";out.appendChild(el("div","msg"+(cls?" "+cls:""),t))}

/* tabs */
function tab(w){
  $("tabWrite").className=w==="w"?"on":"";$("tabLib").className=w==="l"?"on":"";
  $("viewWrite").className=w==="w"?"":"hidden";$("viewLib").className=w==="l"?"":"hidden";
  if(w==="l")renderLib();
}
$("tabWrite").onclick=function(){tab("w")};$("tabLib").onclick=function(){tab("l")};

/* capabilities */
var samplePromise=null;
function getAccess(){try{return localStorage.getItem("poems_access")||""}catch(e){return ""}}
function parseJson(t){
  t=String(t||"").replace(/```json|```/g,"");
  var i=t.indexOf("{"),j=t.lastIndexOf("}");
  if(i<0||j<=i)throw new Error("bad json");
  return JSON.parse(t.slice(i,j+1));
}
function getSample(){
  if(!samplePromise){samplePromise=Promise.resolve({json:async function(prompt,o){
    var r=await fetch("/api/poem",{method:"POST",headers:{"content-type":"application/json","x-access-code":getAccess()},body:JSON.stringify({prompt:prompt}),signal:o&&o.signal});
    if(r.status===401){
      var c=window.prompt("اكتب رمز الدخول");
      if(c){try{localStorage.setItem("poems_access",c)}catch(e){}}
      var e1=new Error("auth");e1.code="not_granted";throw e1;
    }
    if(r.status===429){var e2=new Error("rate");e2.code="rate_limited";throw e2}
    if(!r.ok){var dd="";try{var jj=await r.json();dd=jj.error||""}catch(x){}var e3=new Error("http "+r.status);e3.code="error";e3.detail=(dd||("http "+r.status));throw e3}
    var j=await r.json();
    try{return parseJson(j.text)}catch(x){var e4=new Error("bad json");e4.code="bad_json";e4.detail="";throw e4}
  }})}
  return samplePromise;
}
function saveLib(){try{localStorage.setItem("poems_lib",JSON.stringify(lib))}catch(e){}}
function afterLibChange(){
  if(!$("viewLib").classList.contains("hidden"))renderLib();
  if(cur&&!curId){var k=sig(cur);for(var i=0;i<lib.length;i++)if(sig(lib[i])===k){curId=lib[i]._id;break}}
  refreshActs();
}
function initDb(){
  try{lib=JSON.parse(localStorage.getItem("poems_lib")||"[]")}catch(e){lib=[]}
  libReady=true;
  dbRef={
    add:async function(d){var id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);var x=Object.assign({},d,{_id:id});lib.unshift(x);saveLib();afterLibChange();return {id:id}},
    doc:function(id){return {delete:async function(){lib=lib.filter(function(p){return p._id!==id});saveLib();afterLibChange()}}}
  };
  afterLibChange();
}
function sig(p){return (p.title||"")+"|"+((p.lines||[])[0]||"")}

/* text helpers */
function plainText(d){
  var t=[d.title||"قصيدة",""];
  (d.lines||[]).forEach(function(l){t.push(String(l).split("***").map(function(h){return h.trim()}).join("   ◆   "))});
  t.push("","المعنى:",d.meaning||"","","— قصيدة ومعناها");
  return t.join("\n");
}
function copyText(text,holder,button){
  var fail=function(){
    if(holder.querySelector(".fallback"))return;
    button.textContent="حدّد وانسخ يدوي";
    var ta=el("textarea","fallback");ta.value=text;ta.readOnly=true;holder.appendChild(ta);ta.focus();ta.select();
  };
  try{navigator.clipboard.writeText(text).then(function(){button.textContent="تم النسخ ✓"},fail)}catch(e){fail()}
}

/* poem card */
function poemCard(d,withActs){
  var c=el("div","card");
  c.appendChild(el("h2","",d.title||"قصيدة"));
  var tg=[d.meter&&("بحر "+d.meter),d.style].filter(Boolean).join(" · ");
  if(tg)c.appendChild(el("div","tag",tg));
  c.appendChild(rule());
  (d.lines||[]).forEach(function(l,i){var v=el("div","v");v.style.setProperty("--i",i);
    var p=String(l).split("***").map(function(h){return h.trim()});
    v.appendChild(el("span","",p[0]||""));
    if(p.length>1){v.appendChild(el("em"));v.appendChild(el("span","",p[1]))}
    else{v.style.gridTemplateColumns="1fr"}
    c.appendChild(v)});
  var s=el("div","sec");s.appendChild(el("h3","","المعنى"));s.appendChild(el("p","",d.meaning||""));c.appendChild(s);
  if(d.words&&d.words.length){var s2=el("div","sec");s2.appendChild(el("h3","","معاني كلمات"));
    d.words.forEach(function(w){var r=el("div","w");r.appendChild(el("b","",w.w));r.appendChild(el("span","",w.m));s2.appendChild(r)});
    c.appendChild(s2)}
  if(withActs){var a=el("div","acts");a.id="acts";c.appendChild(a)}
  return c;
}
function show(d){
  cur=d;out.innerHTML="";out.appendChild(poemCard(d,true));refreshActs();
}
function refreshActs(){
  var a=$("acts");if(!a||!cur)return;a.innerHTML="";
  var card=a.parentNode;
  var cp=btn("نسخ للمشاركة","main",function(){copyText(plainText(cur),card,cp)});a.appendChild(cp);
  if(dbRef){
    if(curId){
      var sv=btn("محفوظة ✓","",null);sv.disabled=true;a.appendChild(sv);
      a.appendChild(btn("احذف من مكتبتي","del",function(){delPoem(curId)}));
    }else{
      var sv2=btn("احفظ في مكتبتي","",async function(){
        sv2.disabled=true;sv2.textContent="جاري الحفظ...";
        try{var r=await dbRef.add(Object.assign({},cur,{createdAt:Date.now()}));curId=r.id;refreshActs()}
        catch(e){sv2.disabled=false;sv2.textContent=(e&&e.code==="quota_exceeded")?"المكتبة ممتلئة":"ما انحفظت، جرّب مرة ثانية"}
      });a.appendChild(sv2);
    }
  }
  if(!curFromLib){
    var fx=btn("صحّح الوزن","",function(){verifyMeter(true)});a.appendChild(fx);
    a.appendChild(btn("اكتب غيرها","",function(){run()}));
  }
}
var curFromLib=false;

/* library */
async function delPoem(id){
  if(!dbRef)return;
  try{await dbRef.doc(id).delete();if(curId===id){curId=null;refreshActs()}}catch(e){}
}
function fmtDate(ms){try{return new Date(ms).toLocaleDateString("ar-SA",{day:"numeric",month:"long",year:"numeric"})}catch(e){return ""}}
function renderLib(){
  libOut.innerHTML="";
  if(!dbRef){libOut.appendChild(el("div","msg","الحفظ ما يشتغل في هذا المتصفح."));return}
  if(!lib.length){libOut.appendChild(el("div","msg","مكتبتك فاضية (محفوظة على هذا الجهاز). اكتب قصيدة واضغط «احفظ في مكتبتي» وتلقاها هنا."));return}
  var box=el("div","lib");
  lib.forEach(function(p){
    var it=el("div","item");
    it.appendChild(el("h4","",p.title||"قصيدة"));
    it.appendChild(el("div","meta",[fmtDate(p.createdAt),p.meter&&("بحر "+p.meter),p.style].filter(Boolean).join(" · ")));
    var f=String((p.lines||[])[0]||"").split("***").map(function(h){return h.trim()}).join("   ◆   ");
    it.appendChild(el("p","first",f));
    var a=el("div","acts");
    a.appendChild(btn("افتحها","main",function(){curFromLib=true;curId=p._id;show(p);tab("w");window.scrollTo(0,0)}));
    var cp=btn("نسخ","",function(){copyText(plainText(p),it,cp)});a.appendChild(cp);
    var d=btn("حذف","del",null);
    d.onclick=function(){
      if(d.dataset.sure){delPoem(p._id)}
      else{d.dataset.sure="1";d.textContent="تأكيد الحذف";setTimeout(function(){if(d.isConnected){delete d.dataset.sure;d.textContent="حذف"}},4000)}
    };
    a.appendChild(d);it.appendChild(a);box.appendChild(it);
  });
  libOut.appendChild(box);
}

/* generation */
async function callJson(prompt,label){
  var sample=await getSample();
  if(!sample){samplePromise=null;var ne=new Error("nosample");ne.code="nosample";throw ne}
  var ctl=new AbortController(),t0=Date.now(),timedOut=false;
  var tick=setInterval(function(){var m=out.querySelector(".msg");if(m)m.textContent=label+" "+Math.round((Date.now()-t0)/1000)+" ثانية"},1000);
  var killer=setTimeout(function(){timedOut=true;ctl.abort()},90000);
  try{return await sample.json(prompt,{cache:false,signal:ctl.signal})}
  catch(e){if(timedOut){var te=new Error("timeout");te.code="timeout";throw te}throw e}
  finally{clearInterval(tick);clearTimeout(killer)}
}
var SHAPE='{"title":"عنوان","meter":"اسم البحر","lines":["الشطر الأول ***الشطر الثاني"],"meaning":"شرح معنى القصيدة بإيجاز في فقرة بنفس لهجة الأسلوب المطلوب","words":[{"w":"كلمة صعبة","m":"معناها"}]}';
function errText(e){
  var c=e&&e.code,d=e&&e.detail?(" ("+e.detail+")"):"";
  if(c==="not_granted")return "رمز الدخول غلط أو ناقص. اضغط مرة ثانية واكتبه.";
  if(c==="timeout")return "طوّل الرد أكثر من اللازم، اضغط مرة ثانية.";
  if(c==="rate_limited")return "كثرت الطلبات، انتظر شوي وجرّب مرة ثانية."+d;
  if(c==="bad_json")return "الرد ما انقرأ، اضغط مرة ثانية."+d;
  return "صار خطأ"+d+"، جرّب مرة ثانية.";
}
function setBusy(b){busy=b;go.disabled=b}
async function run(){
  if(busy)return;
  setBusy(true);curFromLib=false;cur=null;curId=null;msg("جاري كتابة القصيدة...","busy");
  try{
    var want=$("extra").value.trim()||("قصيدة في "+pick),st=$("style").value,mt=$("meter").value,rh=$("rhyme").value,n=$("len").value;
    var prompt="اكتب قصيدة عربية أصلية جديدة بالكامل (من تأليفك، لا تنقل ولا تقتبس من قصيدة لشاعر معروف) حسب الطلب: "+want+". اللغة والأسلوب: "+st+". عدد الأبيات: "+n+" بالضبط. "+
      (mt?("البحر: "+mt+" التزم به في كل بيت. "):"اختر بحراً عروضياً واحداً مناسباً والتزم به في كل بيت دون كسر. ")+
      (rh?("حرف الروي: "+rh+" في آخر كل بيت. "):"قافية واحدة موحدة. ")+
      "اجعل كل شطر بنفس عدد التفعيلات، وراجع التقطيع العروضي لكل شطر في ذهنك قبل الإجابة. صور شعرية قوية وألفاظ مختارة ومعنى عميق، بدون حشو ولا تكرار، وخاتمة مؤثرة. رقم عشوائي للتنويع: "+Math.floor(Math.random()*1e6)+".\n"+
      "أعد JSON فقط بدون أي نص آخر وبهذا الشكل: "+SHAPE+". حقل meter اسم البحر المستخدم. اجعل كل بيت عنصراً واحداً في lines والشطرين مفصولين بـ ***. في words من 2 إلى 4 كلمات فقط.";
    var d=await callJson(prompt,"جاري كتابة القصيدة...");
    d.style=st;
    if($("verify").checked){
      msg("جاري تدقيق الوزن...","busy");
      try{cur=d;var f=await verifyCall(d);if(f)d=f}catch(e2){if(e2&&e2.code==="not_granted")throw e2}
    }
    show(d);
  }catch(e){msg(errText(e))}
  setBusy(false);
}
async function verifyCall(d){
  var prompt="أنت عروضي دقيق. هذه قصيدة:\n"+JSON.stringify({title:d.title,meter:d.meter,lines:d.lines})+
    "\nقطّع كل شطر عروضياً في ذهنك وتأكد أنه على بحر "+(d.meter||"واحد")+" بلا كسر وأن القافية موحدة. عدّل فقط الأشطر المكسورة بأقل تغيير ممكن مع الحفاظ على المعنى والقافية، واترك السليمة كما هي. ثم أعد القصيدة كاملة.\n"+
    "أعد JSON فقط بهذا الشكل: "+SHAPE+". أبقِ حقل meter كما هو، واكتب meaning وwords بما يناسب النص النهائي بنفس لهجة القصيدة.";
  var r=await callJson(prompt,"جاري تدقيق الوزن...");
  if(r&&Array.isArray(r.lines)&&r.lines.length){r.style=d.style;if(!r.meter)r.meter=d.meter;if(!r.title)r.title=d.title;return r}
  return null;
}
async function verifyMeter(manual){
  if(busy||!cur)return;
  setBusy(true);var keep=cur;msg("جاري تدقيق الوزن...","busy");
  try{var f=await verifyCall(keep);curId=null;show(f||keep)}
  catch(e){show(keep);var a=$("acts");if(a)a.parentNode.appendChild(el("div","note",errText(e)))}
  setBusy(false);
}
go.onclick=run;
initDb();
</script>
